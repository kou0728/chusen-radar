<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>端末一覧｜Mobilerun 中継サーバー</title>
<style>
  :root { --ink:#1d1d1f; --sub:#6e6e73; --line:#e5e5ea; --ok:#1a7f37; --ng:#c62828; --bg:#fff; --chip:#f2f2f7; }
  @media (prefers-color-scheme: dark) { :root { --ink:#f5f5f7; --sub:#a1a1a6; --line:#38383a; --ok:#4ac26b; --ng:#ff6b6b; --bg:#1c1c1e; --chip:#2c2c2e; } }
  body { margin:0; padding:16px; font:14px/1.6 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; color:var(--ink); background:var(--bg); }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--sub); font-size:12px; margin:0 0 12px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--sub); font-weight:600; }
  .ok { color:var(--ok); font-weight:700; } .ng { color:var(--ng); font-weight:700; }
  small { color:var(--sub); }
  button { font:inherit; font-size:12px; padding:4px 8px; margin:0 4px 4px 0; border:1px solid var(--line); border-radius:6px; background:var(--chip); color:var(--ink); cursor:pointer; }
  #login { display:none; gap:8px; margin:12px 0; } #login input { flex:1; padding:6px; font:inherit; }
  #msg { min-height:20px; font-size:12px; color:var(--sub); }
  #shot { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); align-items:center; justify-content:center; }
  #shot img { max-height:92vh; max-width:92vw; border-radius:12px; }
  .wrap { overflow-x:auto; }
</style>
</head>
<body>
<h1>端末一覧</h1>
<p class="sub">5秒ごとに更新。ここは Tailscale か、このサーバーの中からだけ開けます。</p>
<div id="login"><input id="tok" type="password" placeholder="管理トークン（HUB_ADMIN_TOKEN）"><button id="save">保存</button></div>
<p id="msg"></p>
<div class="wrap"><table>
  <thead><tr><th>番号</th><th>名前・機種</th><th>Portal</th><th>見張り役</th><th>最後につながった／切れた</th><th>操作</th></tr></thead>
  <tbody id="rows"><tr><td colspan="6">読み込み中…</td></tr></tbody>
</table></div>
<p><button id="csv">台帳をCSVで保存</button></p>
<div id="shot"><img alt="端末の画面"></div>
<script>
(function () {
  var token = ""; try { token = localStorage.getItem("hubToken") || ""; } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  function say(t) { $("msg").textContent = t || ""; }
  function api(method, path, body) {
    return fetch(path, { method: method, headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
                         body: body ? JSON.stringify(body) : undefined })
      .then(function (r) {
        if (r.status === 401) { $("login").style.display = "flex"; throw new Error("管理トークンを入れてください"); }
        return r;
      });
  }
  function fmt(iso) { if (!iso) return "－"; var d = new Date(iso); return (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
  function ago(sec) { if (sec == null) return ""; var m = Math.floor(sec / 60); return m >= 60 ? Math.floor(m / 60) + "時間" + (m % 60) + "分" : m + "分"; }
  function cell(tr, text, cls) { var td = document.createElement("td"); if (cls) td.className = cls; td.textContent = text; tr.append(td); return td; }
  function btn(td, label, fn) { var b = document.createElement("button"); b.textContent = label; b.onclick = fn; td.append(b); }
  function act(method, path, body, done) {
    say("送信中…");
    api(method, path, body).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ("HTTP " + r.status)); return j; }); })
      .then(function (j) { say(done || "完了しました"); load(); }).catch(function (e) { say(e.message); });
  }
  function shot(n) {
    say("画面を取得中…");
    api("GET", "/api/devices/" + n + "/screenshot").then(function (r) { if (!r.ok) return r.json().then(function (j) { throw new Error(j.error); }); return r.blob(); })
      .then(function (b) { var img = $("shot").querySelector("img"); img.src = URL.createObjectURL(b); $("shot").style.display = "flex"; say(""); })
      .catch(function (e) { say(e.message); });
  }
  $("shot").onclick = function () { $("shot").style.display = "none"; };
  function load() {
    api("GET", "/api/devices").then(function (r) { return r.json(); }).then(function (j) {
      var rows = $("rows"); rows.textContent = "";
      if (!j.devices.length) { var tr = document.createElement("tr"); cell(tr, "まだ端末がありません。iMac の登録スクリプトから追加してください。").colSpan = 6; rows.append(tr); return; }
      j.devices.forEach(function (d) {
        var tr = document.createElement("tr");
        cell(tr, d.number);
        var name = cell(tr, d.label || "（名前なし）"); var sm = document.createElement("small"); sm.textContent = "　" + (d.model || (d.portal && d.portal.device_name) || ""); name.append(sm);
        cell(tr, d.online ? "接続中" : "切断 " + ago(d.offline_for), d.online ? "ok" : "ng");
        cell(tr, d.guardian_online ? "接続中" : "－", d.guardian_online ? "ok" : "");
        cell(tr, fmt(d.last_connected) + " ／ " + fmt(d.last_disconnected));
        var ops = cell(tr, "");
        if (d.online) {
          btn(ops, "画面", function () { shot(d.number); });
          btn(ops, "点灯ON", function () { act("POST", "/api/devices/" + d.number + "/awake", { enabled: true }, "点灯を保つようにしました"); });
          btn(ops, "点灯OFF", function () { act("POST", "/api/devices/" + d.number + "/awake", { enabled: false }, "点灯をやめました"); });
        }
        if (d.guardian_online) btn(ops, "復旧", function () { act("POST", "/api/devices/" + d.number + "/recover", {}, "復旧を指示しました"); });
        rows.append(tr);
      });
    }).catch(function (e) { say(e.message); });
  }
  $("save").onclick = function () { token = $("tok").value.trim(); try { localStorage.setItem("hubToken", token); } catch (e) {} $("login").style.display = "none"; load(); };
  $("csv").onclick = function () {
    api("GET", "/api/devices.csv").then(function (r) { return r.blob(); }).then(function (b) {
      var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "端末一覧.csv"; document.body.append(a); a.click(); a.remove();
    }).catch(function (e) { say(e.message); });
  };
  if (!token) $("login").style.display = "flex";
  load(); setInterval(load, 5000);
})();
</script>
</body>
</html>
