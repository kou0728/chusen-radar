# 手動で登録する抽選。
# アプリ限定・店頭QRなど、Webから自動で拾えない抽選はここに書きます。
# GitHubの画面からこのファイルを編集して保存すれば、次の自動更新で反映されます。
#
# 書き方（apply 以外は省略OK）:
#   - store: ショップ名
#     product: 商品名（keywords.yaml の products と同じ表記だと自動でまとまります）
#     game: pokemon / onepiece / yugioh / duelmasters / dragonball / unionarena / gundam / weiss
#     form: web / app / store / x
#     apply: "11/13 10:00〜11/18 23:59"   ← 受付期間。年は省略可
#     announce: "11/29 10:00"            ← 当選発表
#     purchase: "11/28〜11/30"           ← 購入期間
#     url: 応募ページ（ショップ公式のページ、なければ告知ポスト）
#     conditions: [条件1, 条件2]
#     pref: 東京都                         ← 店舗の都道府県（エリア絞り込みに使う。店名に地名があれば省略可）
#     area: national                      ← 全国チェーン一斉の抽選なら national、地域限定なら other
#     hide: true                          ← 掲載をやめたい時
#
