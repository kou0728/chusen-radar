# 巡回する「大元」のページ一覧。
#
# type:
#   page    … ページを取得して抽選情報を自動抽出（複数件あってもOK）
#   watch   … 抽出はせず、ページ内容が変わったら「更新あり」として通知だけする
#             （ログイン必須・画像だけの告知など、自動抽出が難しいページ向け）
#   x_user  … ショップのXアカウントの投稿から抽選告知を拾う（X APIのトークンが必要）
# render: true … JavaScriptで描画されるページ。ヘッドレスブラウザで開いてから読む
# game / form / store … 抽出結果に付ける既定値（ページ内から判定できない時に使う）
#
# 1件追加するだけで巡回対象になります。止めたい時は enabled: false。

defaults:
  interval_minutes: 30
  user_agent: "ChusenRadarBot/1.0 (+https://kou0728.github.io/chusen-radar/about.html)"

sources:
  # --- LivePocket（各ショップの店頭受け取り抽選の応募ページが集まる場所） ---
  # キーワードで検索 → 抽選ページを開いて受付期間・発表日・店舗の都道府県を読み取ります。
  - id: livepocket
    enabled: false   # LivePocketは自動アクセスにbot対策（HTTP 202）を返すため停止中。手動登録で補う
    name: LivePocket（各ショップの抽選）
    type: livepocket
    max_pages: 3        # キーワードごとに何ページ目まで見るか
    max_details: 60     # 1回の巡回で新しく開く抽選ページの上限
    keywords:
      - ポケモンカード
      - ワンピースカード
      - 遊戯王
      - デュエル・マスターズ
      - ドラゴンボール フュージョンワールド
      - ユニオンアリーナ
      - ガンダムカードゲーム
      - デジモンカード
      - ホロライブ カード
      - ヴァイスシュヴァルツ
      - ヴァンガード
      - バトルスピリッツ
      - ロルカナ

  # --- 公式・大手通販 ---
  - id: pokemoncenter-lottery
    name: ポケモンセンターオンライン
    type: page
    url: https://www.pokemoncenter-online.com/lottery/apply.html
    render: true
    game: pokemon
    form: web

  - id: yodobashi-limited
    name: ヨドバシ・ドット・コム
