# 抽選ページとみなすキーワード（どれか1つ必須）
lottery_words: [抽選, 応募, エントリー, 招待リクエスト, 予約抽選]
# 除外キーワード（当選者発表のみ・終了告知など）
exclude_words: [抽選結果のお知らせ, 当選者の発表は終了, 受付は終了いたしました, 参加抽選, 観覧抽選, 観戦, 入場抽選, チケット, リポストした方の中から, プレゼントキャンペーン]
